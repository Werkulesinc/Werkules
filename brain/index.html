<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werkules // Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;--cyan:#3ee08a;--cyan-dim:#1f7a52;--cyan-soft:#8af0b8;
    --crimson:#ff7a6a;--amber:#ffc46b;--green:#3ee08a;--gold:#ffd98a;
    --text:#cdeede;--dim:#5f8472;--panel:rgba(8,20,15,0.72);--line:rgba(62,224,138,0.18);
    --font:'Share Tech Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);}

  /* ── FRAMELESS TITLE BAR ── */
  #titlebar{
    flex:0 0 36px;display:flex;align-items:center;
    background:rgba(2,5,3,0.97);border-bottom:1px solid var(--line);
    position:relative;z-index:20;
    -webkit-app-region:drag;user-select:none;
  }
  #tb-logo{color:var(--cyan);font-size:12px;letter-spacing:6px;padding:0 16px;
    text-shadow:0 0 12px rgba(62,224,138,.4);pointer-events:none;}
  #tb-clock{position:absolute;left:50%;transform:translateX(-50%);
    color:var(--cyan);font-size:12px;letter-spacing:2px;pointer-events:none;}
  #tb-controls{margin-left:auto;display:flex;-webkit-app-region:no-drag;}
  .tb-btn{
    width:46px;height:36px;border:none;background:transparent;
    color:var(--dim);font-family:var(--font);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s;
    -webkit-app-region:no-drag;
  }
  .tb-btn:hover{background:rgba(62,224,138,.1);color:var(--cyan);}
  #btn-close:hover{background:rgba(255,60,60,.2);color:#ff5555;}

  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  #main{flex:1 1 auto;position:relative;overflow:hidden;}

  /* ── PANEL HANDLES ── */
  .panel-handle{position:absolute;top:0;bottom:0;width:6px;z-index:8;cursor:col-resize;background:transparent;}
  .panel-handle::after{content:"";position:absolute;top:0;bottom:0;left:2px;width:2px;background:var(--line);transition:background .15s,box-shadow .15s;}
  .panel-handle:hover::after,.panel-handle.dragging::after{background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
  #lh{right:0;} #rh{left:0;}

  /* ── EDGE TABS (shown when panel fully closed) ── */
  .edge-tab{
    position:absolute;top:50%;transform:translateY(-50%);width:18px;height:64px;z-index:9;
    cursor:pointer;background:rgba(8,20,15,.92);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--cyan);font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s,background .15s;
  }
  .edge-tab:hover{background:rgba(62,224,138,.14);border-color:rgba(62,224,138,.5);}
  #left-tab{left:0;border-left:none;border-radius:0 6px 6px 0;}
  #right-tab{right:0;border-right:none;border-radius:6px 0 0 6px;}
  .edge-tab.show{opacity:1;pointer-events:auto;}

  /* ── PANEL TOGGLE BUTTONS ── */
  .panel-toggle{
    background:transparent;border:1px solid var(--line);border-radius:4px;
    color:var(--cyan);font-family:var(--font);font-size:12px;cursor:pointer;
    width:22px;height:20px;padding:0;line-height:1;
    transition:.15s;flex-shrink:0;
  }
  .panel-toggle:hover{background:rgba(62,224,138,.12);border-color:var(--cyan);}

  /* ── LEFT TREE ── */
  #left{position:absolute;left:0;top:0;bottom:0;width:260px;z-index:5;
    display:flex;flex-direction:column;border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(8,20,15,.93),rgba(2,6,4,.90));overflow:hidden;
    transition:width .25s ease;}
  .lhead{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;
    border-bottom:1px solid var(--line);}
  .lhead b{color:var(--cyan);letter-spacing:2px;font-size:11px;}
  .tree{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:5px 3px;font-size:11.5px;}
  .row{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;
    white-space:nowrap;color:var(--text);cursor:default;}
  .row:hover{background:rgba(62,224,138,.06);}
  .row .car{color:var(--dim);width:11px;flex-shrink:0;text-align:center;font-size:10px;}
  .row.lvl1{padding-left:16px;}.row.lvl2{padding-left:30px;}
  .row .ct{margin-left:auto;color:var(--cyan-dim);font-size:10px;
    background:rgba(62,224,138,.08);border-radius:8px;padding:0 5px;flex-shrink:0;}
  .fname{overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;}
  .lock-ico{font-size:9px;color:var(--amber);flex-shrink:0;}
  .row.pulse{animation:rowpulse 1.6s ease;}
  .row.active{background:rgba(62,224,138,.11);}
  .row[data-node-id]{cursor:pointer;}
  .row[data-node-id]:hover{background:rgba(62,224,138,.10);}
  @keyframes rowpulse{
    0%{background:rgba(84,224,138,.45);box-shadow:0 0 10px rgba(84,224,138,.4);}
    100%{background:transparent;box-shadow:none;}
  }

  /* ── CENTER CANVAS ── */
  #center{position:absolute;inset:0;}
  #center canvas{display:block;}

  /* HUD rings */
  #hud{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:4;
    width:min(80vmin,620px);height:min(80vmin,620px);filter:drop-shadow(0 0 6px rgba(62,224,138,.35));}
  #hud svg{width:100%;height:100%;overflow:visible;}
  .hud-cw{transform-origin:100px 100px;animation:hudCW 30s linear infinite;}
  .hud-ccw{transform-origin:100px 100px;animation:hudCCW 46s linear infinite;}
  .hud-cw2{transform-origin:100px 100px;animation:hudCW 72s linear infinite;}
  @keyframes hudCW{to{transform:rotate(360deg);}}
  @keyframes hudCCW{to{transform:rotate(-360deg);}}

  /* hover card */
  #hover{position:absolute;z-index:9;pointer-events:none;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12px;
    max-width:240px;backdrop-filter:blur(8px);opacity:0;transition:opacity .12s;}
  #hover .h{color:var(--cyan-soft);font-size:13px;margin-bottom:4px;}
  #hover .a{font-size:10px;letter-spacing:1px;text-transform:uppercase;}
  #hover .p{color:var(--dim);font-size:11px;margin-top:4px;word-break:break-all;}
  #hover .lk{color:var(--gold);font-size:11px;margin-top:3px;}
  #hover .vo{color:var(--amber);font-size:10px;margin-top:4px;letter-spacing:1px;}

  /* located card */
  #located{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);z-index:9;
    background:var(--panel);border:1px solid var(--green);border-radius:9px;
    padding:11px 16px;backdrop-filter:blur(8px);opacity:0;transition:opacity .2s;
    text-align:center;max-width:88%;pointer-events:none;}
  #located.show{opacity:1;}
  #located .h{color:var(--green);font-size:13px;}
  #located .p{color:var(--cyan);font-size:11px;margin-top:4px;letter-spacing:1px;word-break:break-all;}
  #located .lk{color:var(--gold);font-size:11px;margin-top:4px;}
  #located .x{color:var(--dim);font-size:10px;margin-top:6px;}

  /* ── MIC BUTTON ── */
  #mic-btn{
    position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;
    width:60px;height:60px;border-radius:50%;
    border:2px solid rgba(255,68,68,.45);background:rgba(4,7,15,0.88);
    color:rgba(255,68,68,.55);font-size:26px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .2s,color .2s,box-shadow .2s;backdrop-filter:blur(6px);
  }
  #mic-btn:hover{box-shadow:0 0 14px rgba(255,68,68,.25);}
  #mic-btn.live{border-color:var(--green);color:var(--green);animation:micpulse 1.2s ease infinite;}
  @keyframes micpulse{
    0%,100%{box-shadow:0 0 0 0 rgba(62,224,138,.55);}
    50%{box-shadow:0 0 0 16px rgba(62,224,138,0);}
  }
  #mic-label{
    position:absolute;bottom:84px;left:50%;transform:translateX(-50%);z-index:10;
    font-size:10px;color:var(--dim);letter-spacing:2px;pointer-events:none;white-space:nowrap;
    transition:color .2s;
  }
  #mic-label.live{color:var(--green);}

  /* ── LEGEND ── */
  #legend{
    position:absolute;bottom:18px;left:12px;z-index:8;font-size:10px;color:var(--dim);
    pointer-events:none;letter-spacing:1px;background:rgba(2,5,3,0.65);
    padding:3px 8px;border-radius:4px;border:1px solid rgba(62,224,138,.1);
  }

  /* ── RIGHT PANEL ── */
  #right{position:absolute;right:0;top:0;bottom:0;width:360px;z-index:5;
    display:flex;flex-direction:column;border-left:1px solid var(--line);
    background:linear-gradient(180deg,rgba(8,20,15,.93),rgba(2,6,4,.90));overflow:hidden;
    transition:width .25s ease;}
  .rhead{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--cyan);
    letter-spacing:2px;font-size:12px;display:flex;justify-content:space-between;}
  .rhead .on{color:var(--green);}
  #chat{flex:1 1 auto;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:7px;
    font-size:13px;line-height:1.55;}
  .line{animation:fade .25s ease;white-space:pre-wrap;word-wrap:break-word;}
  .line .who{letter-spacing:1px;}
  .line.you{color:#d6efe4;}.line.you .who{color:#9fd2b8;}
  .line.jarvis{color:var(--cyan-soft);}.line.jarvis .who{color:var(--cyan);}
  .line.sys{color:var(--dim);font-size:12px;}.line.sys b{color:var(--cyan-soft);}
  .cursor{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .atts{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .att{display:inline-flex;align-items:center;gap:5px;font-size:11px;
    background:rgba(62,224,138,.12);border:1px solid var(--line);
    border-radius:14px;padding:3px 9px;color:var(--text);}
  .att b{cursor:pointer;color:var(--crimson);font-size:13px;}
  #tray{display:none;flex-wrap:wrap;gap:6px;padding:8px 14px 0;}
  #inputbar{flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:10px 12px 12px;
    border-top:1px solid var(--line);}
  #inputbar button{flex:0 0 auto;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--cyan);font-family:var(--font);font-size:17px;cursor:pointer;
    transition:.15s;display:flex;align-items:center;justify-content:center;}
  #inputbar button:hover{border-color:var(--cyan);box-shadow:0 0 12px rgba(62,224,138,.2);}
  #attach{font-size:22px;line-height:1;}#send{border-color:rgba(62,224,138,.4);color:var(--green);}
  #msg{flex:1 1 auto;resize:none;max-height:120px;background:rgba(4,7,15,.6);
    border:1px solid var(--line);border-radius:9px;color:var(--text);
    font-family:var(--font);font-size:13px;padding:10px 12px;outline:none;line-height:1.4;}
  #msg:focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(62,224,138,.25);}
  #drop{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;
    background:rgba(4,12,18,.86);border:2px dashed var(--cyan);border-radius:10px;
    color:var(--cyan);font-size:16px;letter-spacing:1px;backdrop-filter:blur(4px);text-align:center;}
  #right.dragover #drop{display:flex;}

  /* loading */
  #loading{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:var(--bg);transition:opacity .6s;}
  #loading .l1{color:#3ee08a;letter-spacing:8px;font-size:18px;text-shadow:0 0 18px rgba(62,224,138,.55);}
  #loading .l2{color:var(--dim);font-size:11px;letter-spacing:3px;margin-top:10px;}
</style>
</head>
<body>
<div id="loading"><div class="l1">W.E.R.K.U.L.E.S</div><div class="l2">igniting the core…</div></div>
<div id="wrap">

  <!-- FRAMELESS TITLE BAR -->
  <div id="titlebar" class="pywebview-drag-region">
    <div id="tb-logo">W·E·R·K·U·L·E·S</div>
    <div id="tb-clock"><span id="clk">--:--:--</span></div>
    <div id="tb-controls">
      <button class="tb-btn" id="btn-min" title="Minimize">—</button>
      <button class="tb-btn" id="btn-max" title="Restore">❐</button>
      <button class="tb-btn" id="btn-close" title="Close">✕</button>
    </div>
  </div>

  <div id="main">
    <!-- LEFT TREE -->
    <aside id="left">
      <div id="lh" class="panel-handle"></div>
      <div class="lhead">
        <b>◈ DIGITAL BRAIN</b>
        <span style="color:var(--dim);font-size:10px;flex:1;margin:0 6px">live mirror</span>
        <button class="panel-toggle" id="toggle-left" title="Collapse">«</button>
      </div>
      <div class="tree" id="tree">
        <div class="row" style="color:var(--dim);padding:12px 8px;font-size:11px">loading…</div>
      </div>
    </aside>

    <!-- CENTER GALAXY -->
    <section id="center">
      <!-- HUD rings (unchanged) -->
      <div id="hud">
        <svg viewBox="0 0 200 200">
          <g class="hud-ccw" fill="none" stroke="#3ee08a">
            <circle cx="100" cy="100" r="96" stroke-width="1" opacity="0.45" stroke-dasharray="44 30 8 30 64 30 8 188"/>
            <circle cx="100" cy="100" r="90" stroke-width="0.6" opacity="0.16" stroke-dasharray="120 44 36 200"/>
          </g>
          <g class="hud-cw2" fill="none" stroke="#8af0b8" stroke-width="2.6" opacity="0.9">
            <path d="M 100 8 A 92 92 0 0 1 127 12"/>
            <path d="M 192 100 A 92 92 0 0 1 188 127"/>
            <path d="M 100 192 A 92 92 0 0 1 73 188"/>
            <path d="M 8 100 A 92 92 0 0 1 12 73"/>
          </g>
          <g class="hud-cw" fill="none" stroke="#3ee08a">
            <circle cx="100" cy="100" r="78" stroke-width="2" opacity="0.55" stroke-dasharray="1 7"/>
            <circle cx="100" cy="100" r="72" stroke-width="0.5" opacity="0.16"/>
          </g>
          <g class="hud-ccw" fill="none" stroke="#3ee08a">
            <circle cx="100" cy="100" r="62" stroke-width="3" opacity="0.10" stroke-dasharray="30 30 6 30 30 184"/>
          </g>
          <g stroke="#8af0b8" stroke-width="1.4" opacity="0.7">
            <line x1="100" y1="2" x2="100" y2="11"/>
            <line x1="198" y1="100" x2="189" y2="100"/>
            <line x1="100" y1="198" x2="100" y2="189"/>
            <line x1="2" y1="100" x2="11" y2="100"/>
          </g>
          <g class="hud-cw" fill="#8af0b8" opacity="0.85">
            <circle cx="100" cy="16" r="1.6"/>
            <circle cx="184" cy="100" r="1.6"/>
            <circle cx="100" cy="184" r="1.2"/>
          </g>
        </svg>
      </div>
      <div id="hover"></div>
      <div id="located"></div>
      <!-- MIC -->
      <button id="mic-btn" title="Talk to Jarvis">🎙</button>
      <div id="mic-label">click to talk</div>
      <!-- LEGEND -->
      <div id="legend">🔒 program file (view-only)</div>
    </section>
    <!-- RIGHT CHAT -->
    <aside id="right">
      <div id="rh" class="panel-handle"></div>
      <div class="rhead">
        <button class="panel-toggle" id="toggle-right" title="Collapse">»</button>
        <span style="flex:1;margin:0 6px">▸ JARVIS</span>
        <span class="on">● online</span>
      </div>
      <div id="chat"></div>
      <div id="tray"></div>
      <div id="inputbar">
        <button id="attach" title="Add files">+</button>
        <textarea id="msg" rows="1" placeholder="Message Jarvis…"></textarea>
        <button id="send" title="Send">➤</button>
      </div>
      <input id="fileInput" type="file" multiple hidden>
      <div id="drop"><div>⬇ Drop files to feed the brain</div></div>
    </aside>
    <!-- Edge tabs — visible only when the panel is fully closed -->
    <div id="left-tab" class="edge-tab" title="Open files tree">»</div>
    <div id="right-tab" class="edge-tab" title="Open Jarvis chat">«</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   GROUP / COLOR DEFINITIONS
═══════════════════════════════════════════════════════════ */
const GROUPS={
  actions:{color:'#3ee08a',hex:0x3ee08a},
  agent:  {color:'#7fd4ff',hex:0x7fd4ff},
  memory: {color:'#c79bff',hex:0xc79bff},
  config: {color:'#ffc46b',hex:0xffc46b},
  core:   {color:'#ff7a6a',hex:0xff7a6a},
  brain:  {color:'#54e08a',hex:0x54e08a},
  vault:  {color:'#ffd98a',hex:0xffd98a},
  root:   {color:'#9fb0cc',hex:0x9fb0cc},
  logs:   {color:'#5f8472',hex:0x5f8472},
};

// Cluster directions — spread evenly on a sphere
const CLUSTER_DIRS={};
(function(){
  const keys=Object.keys(GROUPS);
  keys.forEach((k,i)=>{
    const a=i/keys.length*Math.PI*2+0.5;
    const y=[0.5,-0.4,0.15,-0.55,0.35,-0.2,0.6,-0.35,0.1][i]||0;
    CLUSTER_DIRS[k]=new THREE.Vector3(Math.cos(a),y,Math.sin(a)).normalize();
  });
})();

function nodeGroup(n){
  const p=n.id.split('/');
  if(p[0]==='vault') return 'vault';
  if(p[0]==='logs')  return 'logs';
  if(p.length===2)   return 'root';   // app/file.py — root level
  return GROUPS[p[1]] ? p[1] : 'root'; // app/actions/... → 'actions'
}

/* ═══════════════════════════════════════════════════════════
   LEFT TREE — built from real node list
═══════════════════════════════════════════════════════════ */
const treeEl=document.getElementById('tree');
const rowByNodeId={};

function buildTree(gnodes){
  treeEl.innerHTML='';
  Object.keys(rowByNodeId).forEach(k=>delete rowByNodeId[k]);

  // Group: top → sub-folder → nodes
  const groups={};
  gnodes.forEach(n=>{
    const p=n.id.split('/');
    const top=p[0];
    const sub=p.length>2 ? p[1] : '__root__';
    if(!groups[top]) groups[top]={};
    if(!groups[top][sub]) groups[top][sub]=[];
    groups[top][sub].push(n);
  });

  ['app','vault','logs'].forEach(top=>{
    if(!groups[top]) return;
    const subs=groups[top];
    const total=Object.values(subs).flat().length;
    const topColor=top==='vault'?GROUPS.vault.color:top==='logs'?GROUPS.logs.color:GROUPS.root.color;

    treeEl.appendChild(mkFolderRow(top+'/',0,total,topColor));

    const subKeys=Object.keys(subs).sort((a,b)=>{
      if(a==='__root__') return 1; if(b==='__root__') return -1;
      return a.localeCompare(b);
    });

    subKeys.forEach(sub=>{
      const snodes=subs[sub];
      const grp=GROUPS[sub] ? sub : (top==='vault'?'vault':'root');
      const subColor=GROUPS[grp]?.color||topColor;
      if(sub==='__root__'){
        snodes.sort((a,b)=>a.name.localeCompare(b.name))
          .forEach(n=>{ const r=mkFileRow(n,1,subColor); treeEl.appendChild(r); rowByNodeId[n.id]=r; });
      } else {
        treeEl.appendChild(mkFolderRow(sub+'/',1,snodes.length,subColor));
        snodes.sort((a,b)=>a.name.localeCompare(b.name))
          .forEach(n=>{ const r=mkFileRow(n,2,subColor); treeEl.appendChild(r); rowByNodeId[n.id]=r; });
      }
    });
  });
}

function mkFolderRow(label,lvl,count,color){
  const el=document.createElement('div');
  el.className='row'+(lvl?' lvl'+lvl:'');
  el.innerHTML=`<span class="car">▸</span>`+
    `<span class="fname" style="color:${color}">${label}</span>`+
    `<span class="ct">${count}</span>`;
  return el;
}

function mkFileRow(n,lvl,fallbackColor){
  const el=document.createElement('div');
  el.className='row'+(lvl?' lvl'+lvl:'');
  el.dataset.nodeId=n.id;
  const grp=nodeGroup(n);
  const color=GROUPS[grp]?.color||fallbackColor||'#9fb0cc';
  const lock=n.locked?'<span class="lock-ico">🔒</span>':'';
  el.innerHTML=`<span class="car">·</span>`+
    `<span class="fname" style="color:${color}">${n.name}</span>${lock}`;
  return el;
}

function flashTreeRow(id){
  const r=rowByNodeId[id]; if(!r) return;
  r.classList.remove('pulse'); void r.offsetWidth; r.classList.add('pulse');
  r.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function highlightTreeRow(id){
  document.querySelectorAll('.row.active').forEach(r=>r.classList.remove('active'));
  const r=rowByNodeId[id]; if(!r) return;
  r.classList.add('active');
  r.scrollIntoView({block:'center',behavior:'smooth'});
}

treeEl.addEventListener('click',e=>{
  const row=e.target.closest('[data-node-id]'); if(!row) return;
  const n=nodeByDataId[row.dataset.nodeId]; if(!n) return;
  selectNode(n);
});

/* ═══════════════════════════════════════════════════════════
   GALAXY ENGINE — Three.js
═══════════════════════════════════════════════════════════ */
const centerEl=document.getElementById('center');
const hudEl=document.getElementById('hud');
const W=()=>centerEl.clientWidth, H=()=>centerEl.clientHeight;

const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x000000,0.0022);
const camera=new THREE.PerspectiveCamera(58,1,0.1,5000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
centerEl.appendChild(renderer.domElement);

function resize(){renderer.setSize(W(),H());camera.aspect=W()/H();camera.updateProjectionMatrix();}

function glowTex(){
  const s=128,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d'),r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.7)');
  r.addColorStop(.6,'rgba(255,255,255,.18)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(c);
}
const GLOW=glowTex();

function lockTex(){
  const s=32,c=document.createElement('canvas');c.width=c.height=s;
  const ctx=c.getContext('2d');
  // shackle arc
  ctx.beginPath();ctx.arc(16,14,6,Math.PI,0);
  ctx.strokeStyle='rgba(255,196,107,1)';ctx.lineWidth=3;ctx.stroke();
  // body
  ctx.fillStyle='rgba(255,196,107,1)';ctx.fillRect(8,13,16,12);
  // keyhole
  ctx.fillStyle='rgba(4,7,15,0.85)';
  ctx.beginPath();ctx.arc(16,19,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillRect(14.5,19,3,4);
  return new THREE.CanvasTexture(c);
}
const LOCK_TEX=lockTex();

// Galaxy group (tilted, slowly spinning)
const galaxy=new THREE.Group(); galaxy.rotation.x=-0.35; galaxy.scale.setScalar(0.62); scene.add(galaxy);
const nodesGroup=new THREE.Group(); galaxy.add(nodesGroup);

// Dense granular star cloud (galaxy body) — UNCHANGED
(function(){
  const N=900,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=180*Math.pow(Math.random(),0.7),th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph)*0.62; pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const warm=1-r/200,clr=new THREE.Color().setHSL(0.42-warm*0.07,0.5,0.45+warm*0.4);
    col[i*3]=clr.r;col[i*3+1]=clr.g;col[i*3+2]=clr.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  galaxy.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false})));
})();

// NOTE: nebula haze sprites intentionally removed (clean black background)

// Far background stars
const bgGeo=new THREE.BufferGeometry(),bp=new Float32Array(1500);
for(let i=0;i<1500;i++)bp[i]=(Math.random()-.5)*3000;
bgGeo.setAttribute('position',new THREE.BufferAttribute(bp,3));
scene.add(new THREE.Points(bgGeo,new THREE.PointsMaterial({color:0x35564a,size:1.1,transparent:true,opacity:.5})));

// Ripples
const CORE={cur:new THREE.Vector3(0,0,0)};
const ripples=[];
function ring(){
  const m=new THREE.Mesh(new THREE.RingGeometry(1,1.4,48),
    new THREE.MeshBasicMaterial({color:0xffe6a8,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  galaxy.add(m);return m;
}
for(let i=0;i<6;i++) ripples.push({m:ring(),t:9});
function emit(){const r=ripples.find(r=>r.t>=1);if(r)r.t=0;}

// Node + link state
let nodes=[],links=[],pickable=[];
let linkGeo,linkPos,linkCol,linkLines;
const nodeByDataId={};

function addNode(dn,flash){
  const grp=nodeGroup(dn);
  const gd=GROUPS[grp]||GROUPS.root;
  const col=new THREE.Color(gd.hex);
  const base=dn.locked?(1.6+Math.random()*.7):(3.0+Math.random()*1.2);

  const mat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.9});
  const sph=new THREE.Mesh(new THREE.SphereGeometry(base,14,14),mat);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({
    map:GLOW,color:col,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.65}));
  halo.scale.set(base*5.5,base*5.5,1);

  const g=new THREE.Group(); g.add(sph); g.add(halo);

  // lock badge sprite for locked nodes
  if(dn.locked){
    const ls=new THREE.Sprite(new THREE.SpriteMaterial({map:LOCK_TEX,transparent:true,opacity:.85,depthWrite:false}));
    ls.scale.set(base*3.2,base*3.2,1);
    ls.position.set(base*1.0,base*1.15,0);
    g.add(ls);
  }

  nodesGroup.add(g);
  const dir=(CLUSTER_DIRS[grp]||new THREE.Vector3(1,0,0)).clone();
  const rad=140*(0.6+Math.random()*.75);
  const tgt=dir.multiplyScalar(rad).add(
    new THREE.Vector3((Math.random()-.5),(Math.random()-.5),(Math.random()-.5)).multiplyScalar(55));
  tgt.y*=0.7;

  const n={
    id:dn.id,label:dn.name,path:dn.path,locked:dn.locked,group:grp,
    cur:flash?new THREE.Vector3(0,0,0):tgt.clone(),tgt,
    obj:g,mat,halo,sph,base,
    flash:flash?1.5:0,bob:Math.random()*6.28,bobR:5+Math.random()*7
  };
  sph.userData.node=n;
  nodes.push(n); pickable.push(sph); nodeByDataId[dn.id]=n;
  return n;
}

function rebuildLinks(){
  linkPos=new Float32Array(links.length*6); linkCol=new Float32Array(links.length*6);
  if(linkLines){galaxy.remove(linkLines);if(linkGeo)linkGeo.dispose();}
  linkGeo=new THREE.BufferGeometry();
  linkGeo.setAttribute('position',new THREE.BufferAttribute(linkPos,3));
  linkGeo.setAttribute('color',new THREE.BufferAttribute(linkCol,3));
  linkLines=new THREE.LineSegments(linkGeo,new THREE.LineBasicMaterial(
    {vertexColors:true,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false}));
  galaxy.add(linkLines);
}

function populateGalaxy(gnodes,glinks,flashIds){
  const fset=new Set(flashIds||[]);
  gnodes.forEach(n=>addNode(n,fset.has(n.id)));
  glinks.forEach(l=>{
    const a=nodeByDataId[l.source],b=nodeByDataId[l.target];
    if(a&&b) links.push({a,b,type:l.type});
  });
  rebuildLinks();
  fireBurst(8);
}

function clearGalaxy(){
  while(nodesGroup.children.length>0) nodesGroup.remove(nodesGroup.children[0]);
  nodes=[]; links=[]; pickable=[];
  Object.keys(nodeByDataId).forEach(k=>delete nodeByDataId[k]);
  if(linkLines){galaxy.remove(linkLines);if(linkGeo)linkGeo.dispose();linkLines=null;}
}

/* ═══════════════════════════════════════════════════════════
   SYNAPSES
═══════════════════════════════════════════════════════════ */
let mind='idle',mindEnd=0;
function setMind(s,ms){mind=s;mindEnd=performance.now()+(ms||1500);}
function tickMind(){if(mind!=='idle'&&performance.now()>mindEnd)mind='idle';}

const SIGMAX=70,sigPool=[];
const sigGeo=new THREE.BufferGeometry(),sigPos=new Float32Array(SIGMAX*3);
sigGeo.setAttribute('position',new THREE.BufferAttribute(sigPos,3));
const sigPts=new THREE.Points(sigGeo,new THREE.PointsMaterial(
  {color:0xc8ffe4,size:4.4,map:GLOW,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));
galaxy.add(sigPts);
for(let i=0;i<SIGMAX;i++){sigPool.push({active:false,a:null,b:null,t:0,sp:.02});sigPos[i*3]=99999;}

function fireSignal(from){
  const opts=links.filter(l=>l.a===from||l.b===from); if(!opts.length)return;
  const l=opts[(Math.random()*opts.length)|0];
  const s=sigPool.find(x=>!x.active); if(!s)return;
  s.active=true;s.a=from;s.b=(l.a===from)?l.b:l.a;s.t=0;s.sp=.018+Math.random()*.022;
}
function fireBurst(n){for(let i=0;i<n;i++) setTimeout(()=>{if(nodes.length) fireSignal(nodes[(Math.random()*nodes.length)|0]);},i*50);}
function updateSignals(){
  for(let i=0;i<SIGMAX;i++){
    const s=sigPool[i];
    if(!s.active){sigPos[i*3]=sigPos[i*3+1]=sigPos[i*3+2]=99999;continue;}
    s.t+=s.sp;
    const A=s.a?.cur||CORE.cur,B=s.b?.cur||CORE.cur;
    sigPos[i*3]=A.x+(B.x-A.x)*s.t; sigPos[i*3+1]=A.y+(B.y-A.y)*s.t; sigPos[i*3+2]=A.z+(B.z-A.z)*s.t;
    if(s.t>=1){
      s.active=false;
      if(s.b?.flash!==undefined) s.b.flash=Math.max(s.b.flash||0,.4);
      const ch=mind==='analyzing'?.8:mind==='thinking'?.35:.1;
      if(s.b&&Math.random()<ch) fireSignal(s.b);
    }
  }
  sigGeo.attributes.position.needsUpdate=true;
}

function neighborsOf(n){
  const out=[];
  links.forEach(l=>{if(l.a===n)out.push(l.b);else if(l.b===n)out.push(l.a);});
  return out;
}

/* ═══════════════════════════════════════════════════════════
   CAMERA
═══════════════════════════════════════════════════════════ */
let cT=0.7,cP=1.15,cR=440,auto=true;
let cTTgt=0.7,cPTgt=1.15,cRTgt=440,focusPending=false;
function applyCam(){camera.position.set(cR*Math.sin(cP)*Math.cos(cT),cR*Math.cos(cP),cR*Math.sin(cP)*Math.sin(cT));camera.lookAt(0,0,0);}

function focusNode(n){
  const wp=new THREE.Vector3();
  n.obj.getWorldPosition(wp);
  const d=wp.length(); if(d<1) return;
  cTTgt=Math.atan2(wp.z,wp.x);
  cPTgt=Math.max(0.3,Math.min(2.7,Math.acos(Math.max(-1,Math.min(1,wp.y/d)))));
  cRTgt=Math.max(280,Math.min(520,d*3));
  focusPending=true;
}

let drag=false,px,py,moved=false;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;auto=false;focusPending=false;moved=false;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>{drag=false;});
addEventListener('pointermove',e=>{
  if(drag){
    if(Math.abs(e.clientX-px)+Math.abs(e.clientY-py)>3)moved=true;
    cT-=(e.clientX-px)*.005;cP=Math.max(.25,Math.min(2.85,cP-(e.clientY-py)*.005));
    px=e.clientX;py=e.clientY;
  }
  onHover(e);
});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();focusPending=false;cR=Math.max(170,Math.min(950,cR*(1+Math.sign(e.deltaY)*.08)));cRTgt=cR;},{passive:false});

/* ═══════════════════════════════════════════════════════════
   HOVER + CLICK
═══════════════════════════════════════════════════════════ */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
const hoverEl=document.getElementById('hover'),locEl=document.getElementById('located');
let hoverNode=null,selNode=null;

function pick(e){
  const rect=centerEl.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(pickable)[0];
  return hit?hit.object.userData.node:null;
}

function onHover(e){
  const n=pick(e); const rect=centerEl.getBoundingClientRect();
  if(n){
    hoverNode=n; renderer.domElement.style.cursor='pointer';
    const nb=neighborsOf(n).map(x=>x.label).filter(Boolean).slice(0,5);
    const gc=GROUPS[n.group]?.color||'#9fb0cc';
    const vo=n.locked?'<div class="vo">🔒 view-only</div>':'';
    hoverEl.innerHTML=
      `<div class="h">${n.label}</div>`+
      `<div class="a" style="color:${gc}">${n.group}</div>`+
      `<div class="p">📁 ${n.path}</div>`+
      (nb.length?`<div class="lk">↔ ${nb.join(', ')}</div>`:'')+vo;
    let x=e.clientX-rect.left+14,y=e.clientY-rect.top+14;
    if(x>rect.width-252)x=rect.width-252; if(y>rect.height-120)y=rect.height-120;
    hoverEl.style.left=x+'px'; hoverEl.style.top=y+'px'; hoverEl.style.opacity=1;
  } else {
    hoverNode=null; hoverEl.style.opacity=0;
    renderer.domElement.style.cursor=drag?'grabbing':'grab';
  }
}

function selectNode(n){
  selNode=n; auto=false;
  const nb=neighborsOf(n).map(x=>x.label).filter(Boolean);
  const lockTag=n.locked?' <span style="color:var(--amber)">🔒</span>':'';
  locEl.innerHTML=
    `<div class="h">📍 ${n.label}${lockTag}</div>`+
    `<div class="p">${n.path}</div>`+
    (nb.length?`<div class="lk">↔ ${nb.join(', ')}</div>`:'')+
    `<div class="x">highlighted in tree · click empty space to close</div>`;
  locEl.classList.add('show');
  highlightTreeRow(n.id);
  focusNode(n);
  const cnt=Math.min(neighborsOf(n).length*2+3,8);
  for(let i=0;i<cnt;i++) setTimeout(()=>fireSignal(n),i*55);
}
function clearSelection(){
  selNode=null;
  locEl.classList.remove('show');
  document.querySelectorAll('.row.active').forEach(r=>r.classList.remove('active'));
  focusPending=false;
}
renderer.domElement.addEventListener('click',e=>{
  if(moved) return;
  const n=pick(e); if(n) selectNode(n); else clearSelection();
});

/* ═══════════════════════════════════════════════════════════
   RENDER LOOP
═══════════════════════════════════════════════════════════ */
let speakEnd=0;
function pulse(ms){speakEnd=performance.now()+ms;}
function amp(t){
  const e=Math.max(0,(speakEnd-performance.now())/700);
  if(e<=0)return .14+.05*Math.sin(t*1.3);
  const b=.5+.5*Math.sin(t*9)+.3*Math.sin(t*16+1);
  return Math.min(1,.3+.7*Math.abs(b))*Math.min(1,e+.2);
}

const clock=new THREE.Clock(); let lastR=0;
function frame(){
  requestAnimationFrame(frame);
  const t=clock.getElapsedTime(), a=amp(t);
  galaxy.rotation.y+=auto?0.0009:0.0003;
  if(a>.7&&t-lastR>.18){emit();lastR=t;}
  ripples.forEach(r=>{
    if(r.t<1){r.t+=.018;const s=16+r.t*220;r.m.scale.set(s,s,s);r.m.material.opacity=(1-r.t)*.4;r.m.quaternion.copy(camera.quaternion);}
    else r.m.material.opacity=0;
  });
  if(focusPending){
    const k=0.07;
    let dtT=cTTgt-cT; while(dtT>Math.PI)dtT-=2*Math.PI; while(dtT<-Math.PI)dtT+=2*Math.PI;
    cT+=dtT*k; cP+=(cPTgt-cP)*k; cR+=(cRTgt-cR)*k;
    if(Math.abs(dtT)<0.003&&Math.abs(cPTgt-cP)<0.003&&Math.abs(cRTgt-cR)<0.5) focusPending=false;
  }
  if(auto&&!focusPending)cT+=.0005; applyCam();
  const hk=Math.max(0.45,Math.min(2.6,440/cR));
  hudEl.style.transform='translate(-50%,-50%) scale('+hk.toFixed(3)+')';
  tickMind();
  const rate=mind==='analyzing'?0.9:mind==='thinking'?0.22:0.04;
  if(nodes.length&&Math.random()<rate) fireSignal(nodes[(Math.random()*nodes.length)|0]);
  updateSignals();
  const hi=hoverNode||selNode; const hiSet=hi?new Set([hi,...neighborsOf(hi)]):null;
  nodes.forEach(n=>{
    n.cur.lerp(n.tgt,.045);
    const bob=Math.sin(t*.6+n.bob)*n.bobR*.04;
    n.obj.position.set(n.cur.x,n.cur.y+bob,n.cur.z);
    let baseOp=0.9,sc=1;
    if(hiSet){ if(hiSet.has(n)){sc=n===hi?1.6:1.2;baseOp=1;}else{baseOp=0.18;sc=0.9;} }
    if(n.flash>0){n.flash-=.018;const f=1+n.flash*3.2;sc=Math.max(sc,f);n.mat.opacity=1;n.halo.material.opacity=.7+n.flash*.3;}
    else{n.mat.opacity=baseOp;n.halo.material.opacity=0.55*baseOp+0.1;}
    n.obj.scale.setScalar(sc);
  });
  let vi=0,ci=0;
  links.forEach(l=>{
    const A=l.a.cur,B=l.b.cur;
    linkPos[vi++]=A.x;linkPos[vi++]=A.y;linkPos[vi++]=A.z;
    linkPos[vi++]=B.x;linkPos[vi++]=B.y;linkPos[vi++]=B.z;
    const c=new THREE.Color(GROUPS[l.a.group]?.hex||0x3ee08a);
    const lit=hiSet&&hiSet.has(l.a)&&hiSet.has(l.b);const k=lit?2.2:1;
    for(let q=0;q<2;q++){linkCol[ci++]=c.r*k;linkCol[ci++]=c.g*k;linkCol[ci++]=c.b*k;}
  });
  if(linkGeo){linkGeo.attributes.position.needsUpdate=true;linkGeo.attributes.color.needsUpdate=true;}
  if(linkLines)linkLines.material.opacity=hiSet?0.45:0.18;
  renderer.render(scene,camera);
}

   LIVE UPDATE (from watchdog watcher)

window.werkulesUpdate=function(data){
  const oldIds=new Set(nodes.map(n=>n.id));
  const newIds=new Set(data.nodes.map(n=>n.id));
  const flashIds=[...newIds].filter(id=>!oldIds.has(id));
  clearGalaxy();
  buildTree(data.nodes);
  populateGalaxy(data.nodes,data.links,flashIds);
  flashIds.forEach(id=>setTimeout(()=>flashTreeRow(id),350));
};

const mainEl=document.getElementById('main');
const lPanel=document.getElementById('left'),rPanel=document.getElementById('right');
const leftTab=document.getElementById('left-tab'),rightTab=document.getElementById('right-tab');
let leftW=260,rightW=360;

function setLeftW(w,animate){
  w=Math.max(0,Math.min(mainEl.clientWidth*.6,w));
  lPanel.style.transition=animate?'':'none';
  lPanel.style.width=w+'px';
  if(w>=10) leftW=w;
  leftTab.classList.toggle('show',w<10);
}
function setRightW(w,animate){
  w=Math.max(0,Math.min(mainEl.clientWidth*.6,w));

  rPanel.style.width=w+'px';

function makePanelDrag(handleId,side){
  const h=document.getElementById(handleId);
  h.addEventListener('pointerdown',e=>{
    e.preventDefault();h.classList.add('dragging');h.setPointerCapture(e.pointerId);
    const r=mainEl.getBoundingClientRect();
    function mv(e){side==='left'?setLeftW(e.clientX-r.left,false):setRightW(r.right-e.clientX,false);}
    function up(){
      h.classList.remove('dragging');
      (side==='left'?lPanel:rPanel).style.transition='';
      h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);
    }
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);
  });
}

function initGraph(data){
  buildTree(data.nodes);
  populateGalaxy(data.nodes,data.links,[]);
  const locked=data.nodes.filter(n=>n.locked).length;
  const editable=data.nodes.filter(n=>!n.locked).length;
  setTimeout(()=>jarvis(
    'Brain online. Live-mirroring '+data.nodes.length+' files — '+
    locked+' locked code nodes, '+editable+' editable vault notes, '+
    data.links.length+' connections mapped.'
  ),1200);
}

function waitAndLoad(){
  if(window.pywebview&&window.pywebview.api){
    window.pywebview.api.get_graph().then(initGraph).catch(err=>console.error('get_graph error',err));
  } else {
    setTimeout(waitAndLoad,80);
  }
}

/* ═══════════════════════════════════════════════════════════
   JARVIS WEBSOCKET BRIDGE
═══════════════════════════════════════════════════════════ */
function initWS(){
  ws=new WebSocket('ws://127.0.0.1:7701');
  ws.onopen=()=>{addLine('sys','<b>Jarvis link established.</b>');ws.send(JSON.stringify({type:'set_mute',muted:!micLive}));};
  ws.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==='jarvis'&&d.text) jarvis(d.text);
      else if(d.type==='you'&&d.text) addLine('you','<span class="who">You:</span> '+d.text.replace(/</g,'&lt;'));
    }catch(err){}
  };
  ws.onclose=()=>{addLine('sys','<b>Jarvis link lost — reconnecting…</b>');setTimeout(initWS,3000);};
  ws.onerror=()=>{};
}
initWS();

/* ═══════════════════════════════════════════════════════════
   EDGE + CORNER RESIZE  (proximity detection — no overlay)
   Cursor-near-edge is detected on every pointermove; the zones
   are invisible and carry no pointer-events, so wheel-zoom and
   text-selection pass through at all times.  During an active
   drag the capture-phase listener stops propagation so the
   Three.js orbit controls never see the events.
═══════════════════════════════════════════════════════════ */
(()=>{
  const api=()=>window.pywebview&&window.pywebview.api;
  const T=6,C=12; // edge / corner threshold px
  const CURSOR={n:'ns-resize',s:'ns-resize',w:'ew-resize',e:'ew-resize',
                nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize'};

  function getZone(x,y){
    const W=window.innerWidth,H=window.innerHeight;
    const L=x<C,R=x>W-C,Tp=y<C,B=y>H-C;
    if(Tp&&L) return 'nw'; if(Tp&&R) return 'ne';
    if(B&&L)  return 'sw'; if(B&&R)  return 'se';
    if(x<T)   return 'w';  if(x>W-T) return 'e';
    if(y<T)   return 'n';  if(y>H-T) return 's';
    return null;
  }

  let zone=null,drag=null,last=0,pendingId=0;

  // capture:true → fires before canvas/chat see the event
  document.addEventListener('pointermove',e=>{
    if(drag){
      e.stopPropagation(); // keep orbit controls idle during resize
      const now=Date.now(); if(now-last<32) return; last=now;
      const dx=e.screenX-drag.sx, dy=e.screenY-drag.sy;
      let {bx,by,bw,bh,side:s}=drag;
      if(s.includes('e')) bw=Math.max(700,bw+dx);
      if(s.includes('s')) bh=Math.max(500,bh+dy);
      if(s.includes('w')){const nw=Math.max(700,bw-dx);bx+=bw-nw;bw=nw;}
      if(s.includes('n')){const nh=Math.max(500,bh-dy);by+=bh-nh;bh=nh;}
      if(api()) api().set_bounds(Math.round(bx),Math.round(by),Math.round(bw),Math.round(bh));
      return;
    }
    const z=getZone(e.clientX,e.clientY);
    if(z!==zone){zone=z; document.body.style.cursor=z?CURSOR[z]:'';}
  },{capture:true});

  document.addEventListener('pointerdown',async e=>{
    if(!zone) return;                          // not near any edge — pass through
    e.stopPropagation(); e.preventDefault();
    document.body.setPointerCapture(e.pointerId); // reliable tracking even at speed
    const myId=++pendingId, sx=e.screenX, sy=e.screenY, side=zone;
    if(!api()) return;
    const b=await api().get_bounds();
    if(pendingId===myId) drag={side,sx,sy,bx:b.x,by:b.y,bw:b.w,bh:b.h};
  },{capture:true});

  document.addEventListener('pointerup',()=>{
    pendingId++; drag=null; zone=null; document.body.style.cursor='';
  },{capture:true});
})();
</script>
